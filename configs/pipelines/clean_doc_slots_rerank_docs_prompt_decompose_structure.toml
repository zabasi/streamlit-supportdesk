# clean_doc_slots_rerank_docs_prompt_decompose on structure chunks: cut at headings (levels 1-3), never inside code blocks; short sections merged, long ones split at blocks.
# The chunking (and so its index) is the only difference. Build the index once before evaluating:
#   supportdesk index --pipeline clean_doc_slots_rerank_docs_prompt_decompose_structure

[chunking]
method = "structure"
max_tokens = 512
overlap_tokens = 128

[retrieval]
top_k = 6
candidate_k = 15             # candidates the reranker orders
rerank_snippet_chars = 400   # characters of each candidate the reranker sees
keep_report_query = true     # search with the cleaned report too
max_queries = 3              # up to 3 model-written queries
doc_slots = 10               # documentation among the 15 candidates
rerank_keep_docs = 3         # documentation kept in the final 6 after reranking
historical_filter = true

[context]
max_tokens = 3200            # 6 chunks x 512 tokens: enough room that the budget never drops a chunk
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense_doc_slots"

[prompts]
rewrite = "configs/prompts/rewrite_concepts_system.txt"
rerank = "configs/prompts/rerank_docs_system.txt"

[paths]
index_dir = "index/structure"     # other chunking needs its own index: supportdesk index --pipeline clean_doc_slots_rerank_docs_prompt_decompose_structure
