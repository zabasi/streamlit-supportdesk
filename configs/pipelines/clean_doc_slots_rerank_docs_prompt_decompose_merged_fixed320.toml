# decompose_merged on smaller fixed chunks (320 tokens, 80 overlap), 6 chunks to the model
# within the 3,200-token budget. The chunk size differ from decompose_merged.
# Its own index (shared by both 320-token experiments), built once:
#   supportdesk index --pipeline clean_doc_slots_rerank_docs_prompt_decompose_merged_fixed320

[chunking]
method = "fixed"
max_tokens = 320              # smaller fixed chunks
overlap_tokens = 80           # a quarter of the chunk, as at 512/128

[retrieval]
top_k = 6
candidate_k = 15             # candidates the reranker orders
rerank_snippet_chars = 400   # characters of each candidate the reranker sees
keep_report_query = true     # search with the cleaned report too
max_queries = 3              # up to 3 model-written queries
doc_slots = 10               # documentation among the 15 candidates
rerank_keep_docs = 3         # documentation kept in the final 6 after reranking
historical_filter = true

[context]
max_tokens = 3200            # 6 chunks x 512 tokens: enough room that the budget never drops a chunk
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense_doc_slots"

[prompts]
rewrite = "configs/prompts/rewrite_concepts_system.txt"
rerank = "configs/prompts/rerank_docs_system.txt"

[paths]
index_dir = "index/fixed320"     # its own index: supportdesk index --pipeline clean_doc_slots_rerank_docs_prompt_decompose_merged_fixed320
