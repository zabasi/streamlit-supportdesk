# clean_doc_slots_rerank_docs_prompt_structure with contextual chunk headers: each documentation chunk is embedded with its page title
# and heading path in front. The stored chunk text is unchanged. Headers are the only difference.
# It shares the header index index/structure_ctx with the decompose experiments; if it is not built yet:
#   supportdesk index --pipeline clean_doc_slots_rerank_docs_prompt_structure_ctx

[chunking]
method = "structure"
max_tokens = 512
overlap_tokens = 128
context_header = true        # embed documentation chunks with "page title › headings" in front

[retrieval]
top_k = 6
candidate_k = 15             # candidates the reranker orders
rerank_snippet_chars = 400   # characters of each candidate the reranker sees
doc_slots = 10               # documentation among the 15 candidates
rerank_keep_docs = 3         # documentation kept in the final 6 after reranking
historical_filter = true

[context]
max_tokens = 3200            # 6 chunks x 512 tokens: enough room that the budget never drops a chunk
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense_doc_slots"

[prompts]
rerank = "configs/prompts/rerank_docs_system.txt"

[paths]
index_dir = "index/structure_ctx"     # shared header index: supportdesk index --pipeline clean_doc_slots_rerank_docs_prompt_decompose_structure_ctx
