# clean_doc_slots_rerank_docs_prompt_decompose_structure showing the model 12 small structure chunks instead of 6, within the same 3,200-token
# evidence budget: 25 candidates (18 documentation), the reranker keeps the best 12 with at least 6
# documentation chunks. Same index as clean_doc_slots_rerank_docs_prompt_decompose_structure.

[chunking]
method = "structure"
max_tokens = 512
overlap_tokens = 128

[retrieval]
top_k = 12                   # 12 small sections to the model (same 3,200-token budget)
candidate_k = 25             # candidates the reranker orders
rerank_snippet_chars = 400   # characters of each candidate the reranker sees
keep_report_query = true     # search with the cleaned report too
max_queries = 3              # up to 3 model-written queries
doc_slots = 18               # documentation among the 25 candidates
rerank_keep_docs = 6         # at least 6 documentation chunks in the final 12
historical_filter = true

[context]
max_tokens = 3200            # 6 chunks x 512 tokens: enough room that the budget never drops a chunk
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense_doc_slots"

[prompts]
rewrite = "configs/prompts/rewrite_concepts_system.txt"
rerank = "configs/prompts/rerank_docs_system.txt"

[paths]
index_dir = "index/structure"     # other chunking needs its own index: supportdesk index --pipeline clean_doc_slots_rerank_docs_prompt_decompose_structure
