# The baseline's retrieval (fixed chunks, dense search, 6 chunks) with a corrective loop.
# A model says whether those 6 chunks are enough. If not, it writes a new query and searches
# again, at most retrieval.max_loops times. The generator then sees only the last 6 chunks.
# Shares the baseline's index. There is no web search.

[chunking]
method = "fixed"
max_tokens = 512
overlap_tokens = 128

[retrieval]
top_k = 6
historical_filter = true
max_loops = 3

[context]
max_tokens = 3200
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense"
