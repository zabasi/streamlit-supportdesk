# retrieve_loop_best with a different final choice. Every scored chunk of every try is kept in a pool; when the
# loop ends the generator gets a third of the best, a third from the middle and a third of the worst-scoring
# chunks (6 chunks: 2, 2 and 2; what does not divide by three goes to the best first, then the middle).
# One repeat at most: the first search, then one rewritten query (max_loops = 2 searches).

[chunking]
method = "fixed"
max_tokens = 512
overlap_tokens = 128

[retrieval]
top_k = 6
historical_filter = true
max_loops = 2

[context]
max_tokens = 3200
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense"
