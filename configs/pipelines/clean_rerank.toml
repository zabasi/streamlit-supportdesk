# Combination: the cleaned query (CleanQuery); dense search returns 30 candidates with at least 10
# of them documentation (retriever dense_doc_slots); one model call (LLMReranker) orders them and the
# best 6 are kept. Every other setting is the baseline's. Shares the baseline's index.

[chunking]
method = "fixed"
max_tokens = 512
overlap_tokens = 128

[retrieval]
top_k = 6
candidate_k = 30             # candidates the reranker chooses from
doc_slots = 10               # at least 10 of the 30 candidates are documentation
historical_filter = true

[context]
max_tokens = 3200            # 6 chunks x 512 tokens: enough room that the budget never drops a chunk
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense_doc_slots"
