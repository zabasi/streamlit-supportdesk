# clean_doc_slots_rerank_docs_prompt (the design advanced uses) showing the model 8 chunks instead of 6,
# with the evidence budget raised to 4,300 tokens so they fit. The reranker's call is unchanged.
# The number of chunks is the only difference. Shares the baseline's index.

[chunking]
method = "fixed"
max_tokens = 512
overlap_tokens = 128

[retrieval]
top_k = 8                    # the model sees 8 chunks instead of 6
candidate_k = 15             # candidates the reranker orders
rerank_snippet_chars = 400   # characters of each candidate the reranker sees
doc_slots = 10               # documentation among the 15 candidates
rerank_keep_docs = 3         # documentation kept in the final 8 after reranking
historical_filter = true

[context]
max_tokens = 4300            # room for 8 chunks of up to 512 tokens
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense_doc_slots"

[prompts]
rerank = "configs/prompts/rerank_docs_system.txt"
