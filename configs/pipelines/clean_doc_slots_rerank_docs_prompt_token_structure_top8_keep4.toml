# clean_doc_slots_rerank_docs_prompt_token_structure showing the model 8 chunks instead of 6 (evidence budget 4,300 tokens),
# at least 4 of them documentation. Same index and the same reranking call as clean_doc_slots_rerank_docs_prompt_token_structure.

[chunking]
method = "token_structure"
max_tokens = 512
overlap_tokens = 128

[retrieval]
top_k = 8                    # the model sees 8 chunks instead of 6
candidate_k = 15             # candidates the reranker orders
rerank_snippet_chars = 400   # characters of each candidate the reranker sees
doc_slots = 10               # documentation among the 15 candidates
rerank_keep_docs = 4         # at least 4 documentation chunks in the final 8
historical_filter = true

[context]
max_tokens = 4300            # room for 8 chunks
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense_doc_slots"

[prompts]
rerank = "configs/prompts/rerank_docs_system.txt"

[paths]
index_dir = "index/token_structure"     # other chunking needs its own index: supportdesk index --pipeline clean_doc_slots_rerank_docs_prompt_token_structure
