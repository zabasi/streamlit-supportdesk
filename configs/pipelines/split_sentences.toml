# Experiment: the cleaned query split without a model into up to 4 queries (the title, the code
# lines, the sentences); each is searched and the results are merged by rank fusion. Compare with
# clean_query (one query). Every other setting is the baseline's. Shares the baseline's index.

[chunking]
method = "fixed"
max_tokens = 512
overlap_tokens = 128

[retrieval]
top_k = 6
max_queries = 4              # title, code lines, then sentences
historical_filter = true

[context]
max_tokens = 3200            # 6 chunks x 512 tokens: enough room that the budget never drops a chunk
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense"
