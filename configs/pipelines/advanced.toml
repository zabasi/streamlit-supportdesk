# Settings for the advanced pipeline (--pipeline advanced): the final design. It is the previous design
# (experiments/candidates/candidate-6-doc2query15-rerank-section-controlled-v2) with two answer-step
# fixes from the failure analysis. Every key here overrides configs/default.toml for
# this pipeline only; --config and --set still override it.
#
# Retrieval: the cleaned report is the only query; dense search returns 15 candidates, 10 of them
# documentation; the 15 documentation sections whose symptom questions best match the report each add a
# chunk (retriever question_doc_slots; the questions are written once, offline, by
# scripts/build_section_questions.py into data/questions, and rebuilt when the documentation changes); one
# model call ranks the candidates; the best 8 are kept, at least 5 of them documentation; each kept
# documentation chunk is grown to its whole sections, and pieces of one page that overlap are merged. The
# model sees at most 8 pieces within 4,300 tokens.
# Answer: controlled routing v2 (supportdesk/generation/controlled_v2): gpt-5.4-mini writes a structured
# assessment and Python routes the action (answer, request_info or escalate). About $0.02 per case.
# Fixes (on top of the previous design): version notes (pipeline.version_notes: each evidence piece says
# what version it describes, compared with the reporter's, and how it may be used) and complete questions
# (pipeline.complete_questions: a question asks for every material gap the user can supply). About $0.024
# per case.
#
# Development cases, end to end: 12 of 15 decisions correct (answerable 6/6, clarification 4/6, escalation
# 2/3), every answer citing gold evidence; the external judge: 9 pass, 3 partial, 3 fail. The previous
# design also made 12 (clarification 5/6, escalation 1/3; judge 8 / 4 / 3): the fixes turned DEV-16388
# (answered) into an escalation and DEV-3585 (escalated) into a question, and DEV-5604 and DEV-3903 the
# other way; the judge found the version-as-cause error gone (DEV-4338). Before the fixes: the baseline made 5 (6 pieces) or 6 (8 pieces). Candidate 5
# (the same without the symptom questions) made 11, agreeing on 14 of 15 cases; the one difference,
# DEV-5591, came from the questions bringing in the "Statefulness of widgets" section, after which the
# model asked for the user's code instead of answering. One case of 15 is not a statistical difference:
# the test split decides whether it holds, with candidate 5 run beside it as the labelled alternative.
#
# Fair comparison: advanced uses more room than the baseline (8 pieces and 4,300 tokens against 6 and
# 3,200). Any comparison of the two must also run the baseline at the same budget
# (--set retrieval.top_k=8 --set context.max_tokens=4300), so a gain from choosing better evidence is
# kept apart from a gain from showing more of it.
#
# Tried on this design and not adopted (no gain beyond noise, or a loss): concept queries in any form
# (decompose, weighted, quota and union pools, search-only), hybrid BM25, topic clusters and topic routing
# (filter or boost, fixed or discovered topics, with overlap), structure-aware chunking (token_structure,
# LangChain rule chunks, with section or neighbour completion), the larger embedding model alone or fused,
# a stronger reranking model, report views, the reranker seeing each chunk's sections or other windows
# (first 400 or 600 characters, best 600), a larger pool, the corrective loop, and lighter completion
# (subsection, lower caps, section_trim): siblings of a gold subsection are often gold too.
#
# The concept-query keys below (max_queries, keep_report_query, rerank_show_concepts, prompts.rewrite and
# prompts.rerank) are the previous design's: with decompose = false they are not used (the reranker uses
# the plain prompt, rerank_docs_system.txt). --set retrieval.decompose=true restores that design exactly.

[chunking]
method = "fixed"
max_tokens = 512
overlap_tokens = 128

[retrieval]
question_sections = 15         # documentation sections added through their symptom questions
top_k = 8                    # pieces the model sees
candidate_k = 15             # candidates the reranker orders
rerank_snippet_chars = 400   # characters of each candidate the reranker sees
rerank_snippet = "focused"   # the reranker sees each candidate's best-matching window
rerank_show_concepts = true  # with decompose: the concept queries ("Mechanisms involved")
keep_report_query = true     # with decompose: search with the cleaned report too
max_queries = 3              # with decompose: up to 3 model-written queries
doc_slots = 10               # documentation among the 15 candidates
decompose = false            # the cleaned report is the only query (no concept queries)
complete = "section"         # grow each kept documentation chunk to the whole sections it touches
rerank_keep_docs = 5         # documentation kept in the final 8 after reranking (3 places for the rest)
historical_filter = true

[context]
max_tokens = 4300            # room for 8 pieces after section completion
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
generator = "controlled_v2"    # one structured assessment by gpt-5.4-mini; Python routes the action
retriever = "question_doc_slots"  # dense candidates plus sections found through their symptom questions
scope_gate = "llm"           # the scope check before retrieval is part of advanced's design
version_notes = true             # each evidence piece says what version it describes, and how it may be used
complete_questions = true        # a question asks for every material gap the user can supply

[prompts]
rewrite = "configs/prompts/rewrite_concepts_system.txt"
# Its own answer prompt (copy and edit configs/prompts/answer_system.txt):
# system = "configs/prompts/advanced_system.txt"
rerank = "configs/prompts/rerank_docs_concepts_system.txt"

# If advanced uses different chunking, give it its own index so the two never collide
# (an index built with other chunking is refused). Then build it with:
#   supportdesk index --pipeline advanced
# [paths]
# index_dir = "index/advanced"
