# Experiment: the baseline with split queries. One model call (QueryRewriter) writes up to 3 focused
# queries; each is searched and the results are merged by rank fusion. Compare with rewrite_llm
# (one query). Every other setting is the baseline's. Shares the baseline's index.

[chunking]
method = "fixed"
max_tokens = 512
overlap_tokens = 128

[retrieval]
top_k = 6
max_queries = 3              # the model writes up to 3 queries
historical_filter = true

[context]
max_tokens = 3200            # 6 chunks x 512 tokens: enough room that the budget never drops a chunk
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense"
