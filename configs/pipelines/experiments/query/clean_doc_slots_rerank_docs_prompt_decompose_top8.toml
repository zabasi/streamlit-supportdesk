# decompose (clean_doc_slots_rerank_docs_prompt_decompose) showing the model 8 chunks instead of 6, with
# the evidence budget raised to 4,300 tokens; still at least 3 documentation chunks. The rewrite and
# reranking calls are unchanged. The number of chunks is the only difference.

[chunking]
method = "fixed"
max_tokens = 512
overlap_tokens = 128

[retrieval]
top_k = 8                    # the model sees 8 chunks instead of 6
candidate_k = 15             # candidates the reranker orders
rerank_snippet_chars = 400   # characters of each candidate the reranker sees
keep_report_query = true     # search with the cleaned report too
max_queries = 3              # up to 3 model-written queries
doc_slots = 10               # documentation among the 15 candidates
rerank_keep_docs = 3         # at least 3 documentation chunks in the final 8
historical_filter = true

[context]
max_tokens = 4300            # room for 8 chunks of up to 512 tokens
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense_doc_slots"

[prompts]
rewrite = "configs/prompts/rewrite_concepts_system.txt"
rerank = "configs/prompts/rerank_docs_system.txt"
