# clean_doc_slots_rerank_docs_prompt_decompose_structure_ctx showing the model 15 small structure chunks instead of 6, within the same 3,200-token
# evidence budget: 30 candidates (20 documentation), the reranker keeps the best 15 with at least 8
# documentation chunks. Same index as clean_doc_slots_rerank_docs_prompt_decompose_structure_ctx.

[chunking]
method = "structure"
max_tokens = 512
overlap_tokens = 128
context_header = true        # embed documentation chunks with "page title › headings" in front

[retrieval]
top_k = 15                   # 15 small sections to the model (same 3,200-token budget)
candidate_k = 30             # candidates the reranker orders
rerank_snippet_chars = 400   # characters of each candidate the reranker sees
keep_report_query = true     # search with the cleaned report too
max_queries = 3              # up to 3 model-written queries
doc_slots = 20               # documentation among the 30 candidates
rerank_keep_docs = 8         # at least 8 documentation chunks in the final 15
historical_filter = true

[context]
max_tokens = 3200            # 6 chunks x 512 tokens: enough room that the budget never drops a chunk
max_query_chars = 4000
max_body_chars = 4000

[pipeline]
retriever = "dense_doc_slots"

[prompts]
rewrite = "configs/prompts/rewrite_concepts_system.txt"
rerank = "configs/prompts/rerank_docs_system.txt"

[paths]
index_dir = "index/structure_ctx"     # its own index: supportdesk index --pipeline clean_doc_slots_rerank_docs_prompt_decompose_structure_ctx
