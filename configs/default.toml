# Shared settings for every pipeline. Each pipeline's own values are in configs/pipelines/<name>.toml.
#
# Precedence (lowest -> highest): built-in defaults, this file, the pipeline profile,
# $SUPPORTDESK_CONFIG, --config files, SUPPORTDESK__SECTION__KEY env vars, --set section.key=value.
# `supportdesk config` shows every value in effect and where it came from.
# Relative paths resolve against the directory you run from (the project root).
# The API key never goes here: models.api_key_env names the environment variable that holds it.
# Optional keys (base_url, candidate_k, max_chunks) are left out to keep their default.

[run]
mode = "offline"                 # offline | replay | live

[models]
chat = "gpt-4o-mini"             # must exist on the gateway AND be priced in configs/pricing.json
rerank = ""                                   # chat model for the reranking call only; "" = chat
embedding = "text-embedding-3-small"   # changing it requires re-indexing
second_embedding = "text-embedding-3-large"   # dual_doc_slots: the second model (its own index)
# base_url = "https://..."       # gateway URL (unset: the SDK reads $OPENAI_BASE_URL)
api_key_env = "OPENAI_API_KEY"   # NAME of the env var holding the key; the key itself never goes in a file

[prompts]
system = "configs/prompts/answer_system.txt"
output_format = "configs/prompts/answer_output_format.txt"
rewrite = "configs/prompts/rewrite_system.txt"
rerank = "configs/prompts/rerank_system.txt"
extract = "configs/prompts/extract_system.txt"
judge_coverage = "configs/prompts/judge_coverage_system.txt"
summarize_section = "configs/prompts/summarize_section_system.txt"
label_cluster = "configs/prompts/label_cluster_system.txt"
topic_classify = "configs/prompts/topic_classify_system.txt"
topic_discover = "configs/prompts/topic_discover_system.txt"
topic_refine = "configs/prompts/topic_refine_system.txt"
scope = "configs/prompts/scope_system.txt"
scope_rewrite = "configs/prompts/scope_rewrite_system.txt"
rewrite_missing = "configs/prompts/rewrite_missing_system.txt"
judge = "configs/prompts/judge_system.txt"
loop_rewrite = "configs/prompts/loop_rewrite_system.txt"
judge_scored = "configs/prompts/judge_scored_system.txt"

[paths]
data_dir = "data/processed"
index_dir = "index"              # qdrant/ vector store, chunks.jsonl, manifest.json are written here
artifacts_dir = "artifacts"      # runs/<run_id>/, reports/
cache_path = "artifacts/cache.sqlite"
ledger_path = "artifacts/cost_ledger.jsonl"
pricing_path = "configs/pricing.json"
summaries = "data/summaries/sections.jsonl"
clusters = "data/clusters/clusters.jsonl"
class_labels = "data/classes/llm.jsonl"
second_index_dir = "index/large"

[budget]
ceiling_usd = 5.0                # live spending on this machine stops here (all runs together)
reserve_usd = 0.25
max_live_calls = 5000

[chunking]                       # changing either requires re-indexing (`supportdesk index`)
method = "fixed"
max_tokens = 512
overlap_tokens = 128
context_header = false          # embed documentation chunks with "page title › headings" in front
context_header_scope = "start"  # start: the path where the chunk starts | all: plus every section inside it
structure_min_chars = 150       # structure chunker: shorter sections are merged into the next
structure_max_chars = 2000      # structure chunker: longer sections are split at block boundaries
token_target = 500              # token_structure chunker: the size it aims for
token_soft_max = 700            # token_structure chunker: the most a chunk may grow to
token_min_section = 150         # token_structure chunker: a section this big starts a new chunk
langchain_chunk_chars = 1600    # langchain_rule chunker: most characters per chunk
langchain_overlap_chars = 200   # langchain_rule chunker: characters shared by neighbouring chunks

[retrieval]
top_k = 6                        # chunks returned by retrieval AND (by default) allowed in the prompt
# candidate_k = 20               # candidates fetched before reranking (unset = top_k)
historical_filter = true         # a case only sees material dated before it was filed
embed_batch_size = 64
bm25_k1 = 1.5
bm25_b = 0.75
hybrid_pool = 30
doc_slots = 0                    # places kept for documentation (dense_doc_slots retriever); 0 = none
max_queries = 1                  # most search queries per report (query stages that return several)
keep_report_query = false        # also search with the cleaned report (QueryRewriter, SentenceSplitQuery)
rerank_snippet_chars = 600       # characters of each candidate the LLM reranker sees
rerank_snippet = "start"         # start: the first rerank_snippet_chars | focused: the best-matching window
# rerank_keep_docs = 3           # documentation the LLM reranker keeps in the final top_k (unset: doc_slots)
min_chunks = 2                   # fewest chunks the GradedReranker keeps
extract_mode = "keep"            # ExtractingReranker: the model lists parts to keep, or to drop
extract_show_concepts = false    # ExtractingReranker: show the model the concept queries
extract_protect_top = 0          # ExtractingReranker: never drop parts of this many top-ranked chunks
rerank_show_concepts = false     # the LLM reranker also sees the concept queries ("Mechanisms involved")
summary_sections = 0             # SummaryReranker: add the chunks of this many best-matching sections
hier_sections = 3                # hierarchical retrievers: sections (by summary) the chunk search looks inside
hier_places = 3                  # hierarchical retrievers: returned chunks taken from inside those sections
second_weight = 0.5              # dual_doc_slots: the second embedding model's weight in the fusion
report_views = "none"            # advanced: extra searches: none | title | code | title,code
view_weight = 0.5                # report_views: each view's weight in the fusion against the report
rerank_show_sections = false     # the reranker also sees the section headings inside each candidate
pool_mode = "fuse"               # advanced: fuse (RRF of all queries) | quota (fixed shares) | union (all, no fusion)
union_report = 15                # pool_mode = union: the report's own candidates, all kept
union_per_concept = 12           # pool_mode = union: new candidates each concept query adds
union_max = 40                   # pool_mode = union: most candidates the reranker gets
quota_report_dense = 5           # pool_mode = quota: dense chunks from the cleaned report
quota_report_bm25 = 5            # pool_mode = quota: BM25 chunks from the cleaned report
quota_concepts_dense = 10        # pool_mode = quota: dense chunks from the concept queries, in turns
concept_weight = 1.0             # concept queries' weight in the fusion against the report (1 = equal)
decompose = true                 # advanced: concept queries besides the cleaned report (false: the report alone)
complete = "none"                # after reranking: none | neighbors | section | subsection | trim | section_trim
complete_max_tokens = 900        # retrieval.complete: the most tokens a repaired chunk may grow to
cluster_size = 100               # cluster routing: about this many chunks per topic cluster (build_clusters.py)
cluster_method = "kmeans"        # cluster routing: kmeans | centered | doc_anchored (build_clusters.py)
cluster_top = 2                  # cluster routing: clusters each query is routed to
cluster_route = "keywords"       # cluster routing: keywords | embedding | centroid
cluster_mode = "filter"          # cluster routing: filter (only the routed clusters) | boost
cluster_boost = 0.05             # cluster routing, boost mode: added to routed chunks' similarity
class_route = "llm"              # class_doc_slots: llm | centroid
class_top = 2                    # class_doc_slots: topic classes per query
class_mode = "filter"            # class_doc_slots: filter | boost
class_boost = 0.05               # class_doc_slots, boost mode: added to routed chunks
corrective_judge = "relevance"   # CorrectiveReranker: relevance (yes or no) or coverage (which mechanisms are missing)
corrective_max_missing = 2       # coverage judge: most missing mechanisms searched for in one turn
corrective_turns = 0             # CorrectiveReranker: judge, then rewrite and search again at most this often
expand = "none"                  # ExpandingReranker: add more chunks of found pages: none | page | section | branch
expand_max_candidates = 30       # ExpandingReranker: the most candidates after expansion
section_candidates = 30          # most sections and other candidates the SectionReranker ranks
rerank_doc_places = 0            # documentation places the model fills (DocPlacesReranker)
bm25_slots = 0                   # places filled by BM25 in the hybrid_split retriever; the rest are dense
rrf_k = 60
max_loops = 3                    # retrieve_loop only: judge, then rewrite, at most this many searches

[context]
# max_chunks = 6                 # unset = follows retrieval.top_k; must be <= top_k
max_tokens = 3200                # sized for 6 chunks of 512 tokens
max_query_chars = 4000
max_body_chars = 4000

[generation]
max_output_tokens = 900
max_retries = 1                  # provider errors / non-JSON only; never for a validation failure
temperature = 0.0
timeout_seconds = 60.0

[limits]
max_input_chars = 60000

[pipeline]
name = "baseline"
retriever = "dense"              # dense | bm25 | hybrid
scope_gate = "off"               # advanced only: scope check before retrieval: llm | rules | combined | off (advanced.toml: llm)

[eval]
case_files = ["data/eval"]               # a folder of evaluation files, or case .jsonl files; `index` keeps their issues out of the index
test_fraction = 0.5              # used by `supportdesk split`
split_seed = 7
recall_ks = [1, 3, 6, 10]          # 6 and 10: each pipeline at its own top_k
passage_found_fraction = 0.8      # a gold passage is found when chunks cover this much of it
leakage_overlap_threshold = 0.6
leakage_shingle_tokens = 8

[web]
port = 8765
max_request_bytes = 64000
max_title_chars = 300
max_body_chars = 8000
max_created_at_chars = 40
max_history_items = 20
max_history_chars = 2000

[case]
review = "escalations"            # escalations: only escalations wait for a maintainer | all: every proposal does
